name: API Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run API security scanner
        run: npm run test:api-security
