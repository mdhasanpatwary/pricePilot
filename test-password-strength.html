<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .strength-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .segment {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            transition: background 0.3s;
        }

        .strength-label {
            text-align: right;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .requirements {
            font-size: 13px;
            line-height: 1.8;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #999;
        }

        .requirement.met {
            color: #22c55e;
        }

        .requirement::before {
            content: '✗';
            font-weight: bold;
        }

        .requirement.met::before {
            content: '✓';
        }

        .test-passwords {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .test-btn {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .test-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Password Strength Test</h1>
        <p style="color: #666; font-size: 14px;">Test the password strength indicator with different passwords:</p>

        <input type="password" id="password" placeholder="Enter password...">

        <div class="strength-bar">
            <div class="segment" id="seg1"></div>
            <div class="segment" id="seg2"></div>
            <div class="segment" id="seg3"></div>
            <div class="segment" id="seg4"></div>
        </div>

        <div class="strength-label" id="strengthLabel">-</div>

        <div class="requirements">
            <div class="requirement" id="req-length">At least 12 characters</div>
            <div class="requirement" id="req-lower">One lowercase letter</div>
            <div class="requirement" id="req-upper">One uppercase letter</div>
            <div class="requirement" id="req-number">One number</div>
            <div class="requirement" id="req-special">One special character (@$!%*?&)</div>
        </div>

        <div class="test-passwords">
            <strong style="font-size: 14px;">Quick Tests:</strong><br>
            <button class="test-btn" onclick="testPassword('weak')">Weak (abc)</button>
            <button class="test-btn" onclick="testPassword('fair')">Fair (password1)</button>
            <button class="test-btn" onclick="testPassword('good')">Good (Password1!)</button>
            <button class="test-btn" onclick="testPassword('strong')">Strong (MyP@ssw0rd123)</button>
            <button class="test-btn" onclick="testPassword('very-strong')">Very Strong (MyS3cur3P@ssw0rd!2024)</button>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const segments = [
            document.getElementById('seg1'),
            document.getElementById('seg2'),
            document.getElementById('seg3'),
            document.getElementById('seg4')
        ];
        const strengthLabel = document.getElementById('strengthLabel');

        const colors = {
            'weak': '#ef4444',
            'fair': '#f97316',
            'good': '#eab308',
            'strong': '#84cc16',
            'very-strong': '#22c55e'
        };

        function calculateStrength(password) {
            let score = 0;

            // Length (0-30 points)
            if (password.length >= 12) {
                score += 20;
                if (password.length >= 16) score += 5;
                if (password.length >= 20) score += 5;
            }

            // Lowercase (0-15 points)
            if (/[a-z]/.test(password)) {
                score += 10;
                if ((password.match(/[a-z]/g) || []).length >= 3) score += 5;
            }

            // Uppercase (0-15 points)
            if (/[A-Z]/.test(password)) {
                score += 10;
                if ((password.match(/[A-Z]/g) || []).length >= 2) score += 5;
            }

            // Numbers (0-15 points)
            if (/\d/.test(password)) {
                score += 10;
                if ((password.match(/\d/g) || []).length >= 2) score += 5;
            }

            // Special chars (0-15 points)
            if (/[@$!%*?&]/.test(password)) {
                score += 10;
                if ((password.match(/[@$!%*?&]/g) || []).length >= 2) score += 5;
            }

            // Variety bonus (0-10 points)
            const uniqueChars = new Set(password.split('')).size;
            if (uniqueChars >= 10) score += 5;
            if (uniqueChars >= 15) score += 5;

            // Common patterns penalty
            if (/(.)\1{2,}/.test(password) || /^[a-z]+$/i.test(password) || /^\d+$/.test(password)) {
                score = Math.max(0, score - 10);
            }

            let strength;
            if (score >= 85) strength = 'very-strong';
            else if (score >= 70) strength = 'strong';
            else if (score >= 50) strength = 'good';
            else if (score >= 30) strength = 'fair';
            else strength = 'weak';

            return { strength, score };
        }

        function updateUI(password) {
            if (!password) {
                segments.forEach(seg => seg.style.background = '#e0e0e0');
                strengthLabel.textContent = '-';
                strengthLabel.style.color = '#999';
                return;
            }

            const { strength, score } = calculateStrength(password);
            const filledSegments = Math.ceil((score / 100) * 4);

            segments.forEach((seg, i) => {
                seg.style.background = i < filledSegments ? colors[strength] : '#e0e0e0';
            });

            strengthLabel.textContent = strength.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            strengthLabel.style.color = colors[strength];

            // Update requirements
            document.getElementById('req-length').classList.toggle('met', password.length >= 12);
            document.getElementById('req-lower').classList.toggle('met', /[a-z]/.test(password));
            document.getElementById('req-upper').classList.toggle('met', /[A-Z]/.test(password));
            document.getElementById('req-number').classList.toggle('met', /\d/.test(password));
            document.getElementById('req-special').classList.toggle('met', /[@$!%*?&]/.test(password));
        }

        passwordInput.addEventListener('input', (e) => updateUI(e.target.value));

        function testPassword(type) {
            const passwords = {
                'weak': 'abc',
                'fair': 'password1',
                'good': 'Password1!',
                'strong': 'MyP@ssw0rd123',
                'very-strong': 'MyS3cur3P@ssw0rd!2024'
            };
            passwordInput.value = passwords[type];
            passwordInput.type = 'text';
            updateUI(passwords[type]);
            setTimeout(() => passwordInput.type = 'password', 2000);
        }
    </script>
</body>

</html>
