<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PricePilot API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Custom styling for better appearance */
        .swagger-ui .topbar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #3b82f6;
        }

        .swagger-ui .topbar .download-url-wrapper {
            display: none;
        }

        .swagger-ui .info {
            margin: 30px 0;
        }

        .swagger-ui .info .title {
            font-size: 36px;
            color: #1a1a1a;
        }

        .swagger-ui .scheme-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }

        /* Better tag styling */
        .swagger-ui .opblock-tag {
            font-size: 20px;
            font-weight: 600;
            margin: 20px 0 10px 0;
            padding: 10px 20px;
            border-left: 4px solid #3b82f6;
            background: #f8f9fa;
        }

        /* Method colors */
        .swagger-ui .opblock.opblock-get {
            border-color: #61affe;
            background: rgba(97, 175, 254, 0.1);
        }

        .swagger-ui .opblock.opblock-post {
            border-color: #49cc90;
            background: rgba(73, 204, 144, 0.1);
        }

        .swagger-ui .opblock.opblock-put {
            border-color: #fca130;
            background: rgba(252, 161, 48, 0.1);
        }

        .swagger-ui .opblock.opblock-delete {
            border-color: #f93e3e;
            background: rgba(249, 62, 62, 0.1);
        }

        .swagger-ui .opblock.opblock-patch {
            border-color: #50e3c2;
            background: rgba(80, 227, 194, 0.1);
        }

        /* Response styling */
        .swagger-ui .responses-inner {
            padding: 20px;
        }

        /* Try it out button */
        .swagger-ui .btn.try-out__btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
        }

        .swagger-ui .btn.try-out__btn:hover {
            background: #2563eb;
        }

        /* Execute button */
        .swagger-ui .btn.execute {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
        }

        .swagger-ui .btn.execute:hover {
            background: #059669;
        }

        /* Authorization button */
        .swagger-ui .btn.authorize {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
        }

        .swagger-ui .btn.authorize:hover {
            background: #7c3aed;
        }

        /* Model styling */
        .swagger-ui .model-box {
            background: #f8f9fa;
            border-radius: 4px;
            padding: 15px;
        }

        /* Custom header */
        .custom-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .custom-header .version {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .custom-header .links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            opacity: 0.9;
        }

        .custom-header .links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Custom Header -->
    <div class="custom-header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <h1>🚀 PricePilot API Documentation</h1>
            <span class="version">v1.0.0</span>
        </div>
        <div class="links">
            <a href="/" target="_blank">Dashboard</a>
            <a href="/docs" target="_blank">Guides</a>
            <a href="https://github.com/pricepilot" target="_blank">GitHub</a>
        </div>
    </div>

    <!-- Swagger UI Container -->
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function () {
            // Begin Swagger UI call region
            const ui = SwaggerUIBundle({
                url: "/openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                showExtensions: true,
                showCommonExtensions: true,
                tryItOutEnabled: true,
                persistAuthorization: true,
                displayRequestDuration: true,
                syntaxHighlight: {
                    activate: true,
                    theme: "monokai"
                },
                requestInterceptor: (request) => {
                    // Add custom headers or modify requests here if needed
                    console.log('Request:', request);
                    return request;
                },
                responseInterceptor: (response) => {
                    // Handle responses here if needed
                    console.log('Response:', response);
                    return response;
                },
                onComplete: () => {
                    console.log('Swagger UI loaded successfully');
                }
            });
            // End Swagger UI call region

            window.ui = ui;
        };
    </script>
</body>

</html>
